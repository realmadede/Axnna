name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Cloudflare environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

concurrency:
  group: cloudflare-deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Unified Worker (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    defaults:
      run:
        working-directory: axnna-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: axnna-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploy
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm test

      - name: Validate target environment D1 database ID
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
        run: |
          node -e '
            const fs = require("node:fs");
            const target = process.env.TARGET_ENV;
            const raw = fs.readFileSync("wrangler.toml", "utf8");
            const d1Header = `[[env.${target}.d1_databases]]`;
            const idx = raw.indexOf(d1Header);
            if (idx === -1) {
              console.error(`Missing ${d1Header} configuration in wrangler.toml`);
              process.exit(1);
            }
            const rest = raw.slice(idx + d1Header.length);
            const nextSection = rest.match(/\n\[/);
            const block = nextSection ? rest.slice(0, nextSection.index) : rest;
            const dbMatch = block.match(/database_id\s*=\s*"([^"]+)"/);
            if (!dbMatch || !dbMatch[1] || dbMatch[1].startsWith("REPLACE_WITH_")) {
              console.error(`D1 database_id for environment "${target}" is missing or still a REPLACE_WITH_ placeholder.`);
              process.exit(1);
            }
            console.log(`Validated D1 database binding present for environment: ${target}`);
          '

      - name: Apply D1 migrations & deploy unified Worker
        env:
          TARGET_ENV: ${{ inputs.environment || 'production' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub Repository/Environment Secrets."
            exit 1
          fi
          npx wrangler d1 migrations apply DB --remote --env "$TARGET_ENV"
          npx wrangler deploy --env "$TARGET_ENV"
