name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Cloudflare environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy Unified Worker (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: axnna-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: axnna-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify before deploy
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm test

      - name: Validate target environment D1 database ID
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          node -e '
            const fs = require("node:fs");
            const target = process.env.TARGET_ENV;
            const raw = fs.readFileSync("wrangler.toml", "utf8");
            const sectionHeader = `[env.${target}]`;
            const idx = raw.indexOf(sectionHeader);
            if (idx === -1) {
              console.error(`Missing [${target}] configuration in wrangler.toml`);
              process.exit(1);
            }
            const rest = raw.slice(idx + sectionHeader.length);
            const nextEnvMatch = rest.match(/\n\[env\.[^\]]+\]/);
            const block = nextEnvMatch ? rest.slice(0, nextEnvMatch.index) : rest;
            const dbMatch = block.match(/database_id\s*=\s*"([^"]+)"/);
            if (!dbMatch || !dbMatch[1] || dbMatch[1].startsWith("REPLACE_WITH_")) {
              console.error(`D1 database_id for environment "${target}" is missing or still a REPLACE_WITH_ placeholder.`);
              process.exit(1);
            }
            console.log(`Validated D1 database binding present for environment: ${target}`);
          '

      - name: Apply D1 migrations & deploy unified Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --remote --env "${{ inputs.environment }}"
          npx wrangler deploy --env "${{ inputs.environment }}"
