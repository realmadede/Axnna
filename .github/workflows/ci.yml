name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: axnna-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: axnna-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npx vitest run --exclude src/providers/__tests__/LiveMarketProvider.test.ts

      - name: Build frontend
        run: npm run build
